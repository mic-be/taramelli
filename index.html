<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizzatore 3D - Taramelli24 Lite</title>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #e0e0e0;
            /* Sfondo grigio chiaro */
        }

        model-viewer {
            width: 100%;
            height: 100%;
        }

        /* Stile del pulsante AR (Realtà Aumentata) */
        #ar-button {
            background-color: white;
            border-radius: 20px;
            border: 1px solid #dadce0;
            bottom: 30px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-family: sans-serif;
            font-size: 14px;
            color: #4285f4;
            cursor: pointer;
            box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <model-viewer src="Taramelli24_lite.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls
        tone-mapping="neutral" shadow-intensity="1" exposure="0.46">
        <div class="progress-bar hide" slot="progress-bar">
            <div class="update-bar"></div>
        </div>
        <button slot="ar-button" id="ar-button">
            Visualizza nel tuo spazio
        </button>
        <div id="ar-prompt">
            <img src="https://modelviewer.dev/shared-assets/icons/hand.png">
        </div>
    </model-viewer>

</body>

</html>
